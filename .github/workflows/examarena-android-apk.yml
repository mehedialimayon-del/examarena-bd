name: Build ExamArena BD Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/examarena-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check available Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -la "${ANDROID_HOME}/platforms" || true
          ls -la "${ANDROID_HOME}/build-tools" || true
          if [ ! -d "${ANDROID_HOME}/platforms/android-35" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon --console plain --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
        shell: bash
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ExamArena-APK-Build-Error-Log
          path: android-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ExamArena-BD-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
