name: Build ExamArena BD Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/examarena-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35 and build tools
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --licenses < /dev/null || true
      - name: Build installable debug APK
        working-directory: android-app
        run: gradle --no-daemon --console plain --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ExamArena-BD-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
