name: Quiz integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate quiz
        run: node tests/quiz.test.cjs
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile learner journey smoke test
        run: node tests/mobile-flow.cjs
