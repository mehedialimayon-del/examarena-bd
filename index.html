<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamArena BD</title><style>body{margin:0;background:#080808;color:white;font-family:system-ui;padding:24px}main{max-width:680px;margin:auto}h1,em{color:#ff7300}button{background:#ff7300;border:0;border-radius:9px;padding:13px;margin:6px 0;font-weight:700;cursor:pointer}.option{display:block;width:100%;text-align:left;background:#242424;color:white;border:1px solid #555}#feedback{line-height:1.6}</style><main><h1>ExamArena BD</h1><p>বাংলাদেশের জন্য ফ্রি কুইজ ও পরীক্ষার প্রস্তুতি — প্রাথমিক সংস্করণ</p><p id="count"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status"></p><button id="next" disabled>পরবর্তী প্রশ্ন</button><p id="score"></p><button id="restart">আবার শুরু করুন</button></main><script>const qs=[['বাংলাদেশের জাতীয় ফুল কী?',['শাপলা','গোলাপ','জবা'],0,'শাপলা বাংলাদেশের জাতীয় ফুল।'],['১২ × ৮ কত?',['৯২','৯৬','১০৮'],1,'১২ × ৮ = ৯৬।'],['Rapid শব্দের সমার্থক?',['Slow','Fast','Weak'],1,'Rapid অর্থ দ্রুত।'],['পানির সংকেত?',['CO2','H2O','O2'],1,'পানি H2O।'],['CPU-এর পূর্ণরূপ?',['Central Processing Unit','Central Power Unit','Computer Program Unit'],0,'CPU = Central Processing Unit।']];let i=0,points=0,answered=false;const $=id=>document.getElementById(id);function draw(){answered=false;$('next').disabled=true;$('feedback').textContent='';$('score').textContent='';$('count').textContent='প্রশ্ন '+(i+1)+' / '+qs.length;$('question').textContent=qs[i][0];$('options').replaceChildren(...qs[i][1].map((s,n)=>{let b=document.createElement('button');b.className='option';b.textContent=s;b.onclick=()=>{if(answered)return;answered=true;if(n===qs[i][2])points++;$('feedback').textContent=(n===qs[i][2]?'সঠিক! ':'ভুল। ') +qs[i][3];$('next').disabled=false;[...$('options').children].forEach((v,k)=>{v.disabled=true;if(k===qs[i][2])v.style.borderColor='#31d78a';else if(k===n)v.style.borderColor='#ff5252'})};return b}))}function start(){i=0;points=0;$('next').style.display='inline-block';draw()}$('next').onclick=()=>{if(!answered)return;i++;if(i<qs.length)draw();else{$('question').textContent='কুইজ শেষ!';$('count').textContent='';$('options').replaceChildren();$('feedback').textContent='';$('next').style.display='none';$('score').textContent='আপনার স্কোর: '+points+'/'+qs.length}};$('restart').onclick=start;start();</script></html>
